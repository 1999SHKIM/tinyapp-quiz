<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TinyArcade 테스트 페이지</title>
  <!-- 상대 경로로 불러온다: 플랫폼이 /apps/{deployKey}/ 아래에서 파일을 전달하므로 "/style.css"처럼 맨 앞에 / 를 쓰면 안 된다 -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <h1>TinyArcade 테스트 페이지</h1>

    <p id="status">JS 불러오는 중...</p>
    <button id="btn" type="button">눌러 보기</button>
    <p id="count">0</p>
  </main>
  <script src="./main.js"></script>
